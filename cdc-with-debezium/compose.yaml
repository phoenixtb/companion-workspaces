# Dispatchly's CDC lab: PostgreSQL 18 -> Debezium on Kafka Connect -> Kafka (KRaft).
# Part 1 only needs postgres:  docker compose up -d postgres
# Parts 2 and 3 use the whole stack:  docker compose up -d
name: cdc-with-debezium

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dispatchly
      POSTGRES_USER: dispatchly
      POSTGRES_PASSWORD: dispatchly
    command:
      - postgres
      - -c
      - wal_level=logical             # replica (the default) does not carry enough for logical decoding
      - -c
      - max_replication_slots=10      # one per connector, plus room for the Part 1 experiments
      - -c
      - max_wal_senders=10            # one walsender process per streaming connection
      - -c
      - max_slot_wal_keep_size=2GB    # safety valve: a slot may pin at most this much WAL (Part 3)
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql    # PostgreSQL 18 images keep PGDATA under a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchly -d dispatchly"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # One node that is both broker and KRaft controller. Two client listeners: kafka:29092 for
    # containers on the compose network, localhost:9092 for apps running on the host.
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker, so every internal topic gets replication factor 1. Development only.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (Connect's topic.creation.*, Spring's NewTopic beans), never by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    # Kafka Connect 4.3.1 in distributed mode with the Debezium 3.7 connectors on its plugin path.
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: dispatchly-connect          # workers with the same group.id form one Connect cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      # Any CONNECT_* variable becomes a worker property (CONNECT_A_B -> a.b).
      # Replication factor 1 for Connect's internal topics: development only, use 3 in production.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
