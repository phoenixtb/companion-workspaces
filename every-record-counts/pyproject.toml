[project]
name = "every-record-counts"
version = "0.1.0"
description = "Companion code for 'Every Record Counts: Data Engineering for Backend Engineers'"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3",
    "polars[iceberg]>=2.1",
    "pyarrow>=26.0",
    "duckdb>=2.0",
    "pyiceberg[pyarrow,s3fs,pyiceberg-core]>=0.12",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.3",
    "fastavro>=1.13",
    "dlt[filesystem,pyiceberg]>=1.31",
    "confluent-kafka>=2.16",
    "mcp==2.3.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Part 17: dbt v1 and its adapters (`uv sync --extra dbt`). dbt-oss (v2) needs its own environment: `make dbt-oss-install`.
dbt = ["dbt-core==1.12.6", "dbt-trino==1.11.0", "dbt-duckdb==1.11.1", "openlineage-dbt==1.54.0"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"datagen/manifest.py" = ["E501"]  # the Markdown template's table rows
