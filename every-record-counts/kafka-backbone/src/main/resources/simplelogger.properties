# Warnings and errors only.
org.slf4j.simpleLogger.defaultLogLevel=warn
# Netty (inside the Apicurio client) warns that its macOS DNS resolver isn't on the classpath; the JDK's works here.
org.slf4j.simpleLogger.log.io.netty.resolver.dns=error
# A refused schema is logged with a stack trace by the client's cache; ClickProducer prints the registry's reason.
org.slf4j.simpleLogger.log.io.apicurio.registry.resolver.cache=off
