# The image's single-node config with two Part 17 changes for a 3 GB container (2.4 GB heap).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
# The image's etc/cache-manager-memory.properties raises the coordinator's in-heap metadata-file cache to 2 GB (TTL 24h).
# Not listing it leaves Trino's defaults: the memory cache manager still loads, at 2% of the heap and a 1h TTL.
# cache-manager.config-files=etc/cache-manager-memory.properties
# Finished queries' plans and stats stay in the history for 15 minutes by default. A dbt snapshot replay sends
# thousands in that time; with both defaults the JVM ran out of heap (OutOfMemoryError) during Part 17's tests.
query.min-expire-age=2m
