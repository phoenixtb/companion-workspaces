# Part 13: Larkspur's operational PostgreSQL as a Trino catalog, for federated queries.
# Trino logs in as a read-only role (created by `scripts.part13_engines seed`); in production, point it at a replica.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/larkspur
connection-user=trino_reader
connection-password=${ENV:TRINO_PG_PASSWORD}
