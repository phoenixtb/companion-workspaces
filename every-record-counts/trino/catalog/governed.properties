# Part 23: the catalog people query. Trino reads as its own Polaris principal, `gateway` (gold and customer, read
# only); no person holds that principal's secret, so the only way to these tables is through Trino, where OPA
# filters rows and masks columns per user. Vended, table-scoped credentials as in Part 9.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=larkspur
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=gateway:${ENV:GATEWAY_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=true
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
