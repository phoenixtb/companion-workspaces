# Part 18: the same Polaris catalog as the `developer` principal, for dbt's dev and CI builds. It may create, write
# and drop tables only in the `dev` namespace and read `raw` (sources); production namespaces are out of its reach.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=larkspur
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=developer:developer-lab-secret
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=true
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
