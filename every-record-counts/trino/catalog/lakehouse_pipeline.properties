# Part 17: the same Polaris catalog, as the `pipeline` principal (Part 9), for dbt. No storage keys here:
# Polaris vends table-scoped S3 credentials, read-write where the principal may write the table.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=larkspur
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=pipeline:pipeline-lab-secret
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=true
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
