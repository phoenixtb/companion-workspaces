# Part 23: Trino asks Open Policy Agent before every operation (opa/policy/trino.rego). Rows and columns too.
access-control.name=opa
opa.policy.uri=http://opa:8181/v1/data/trino/allow
opa.policy.batched-uri=http://opa:8181/v1/data/trino/batch
opa.policy.row-filters-uri=http://opa:8181/v1/data/trino/row_filters
opa.policy.batch-column-masking-uri=http://opa:8181/v1/data/trino/batch_masks
