# Larkspur data platform lab. Services are grouped by profile; start only what a part needs:
#   docker compose --profile core up -d --wait                    # storage, catalog, OLTP
#   docker compose --profile core --profile batch up -d --wait    # + Trino and Spark
# Every service has a memory limit; the README has measured peaks per part.

name: every-record-counts

x-lab-env: &lab-env
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
  POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}

# ---------- orchestrate (Part 19): Airflow 3.3, trimmed from the official docker-compose.yaml ----------
# The official file runs CeleryExecutor with Redis, a worker, a triggerer, its own PostgreSQL and FAB login. This lab
# trim (ours, not Airflow's): LocalExecutor (tasks run as subprocesses of the scheduler), no Redis, no worker, no
# triggerer (nothing here defers), the lab PostgreSQL as metadata database (its own database and role), and the
# simple auth manager with authentication switched off. Development only.
x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
      UV_IMAGE: ${UV_IMAGE}
  image: every-record-counts/airflow:3.3.2-lab
  profiles: [orchestrate]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"                 # task processes at once (default 32): each dbt run is ~0.3 GB
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # no login: lab only
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}   # one secret for every component, or tasks can't call the API
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "3"   # per process (default 5); the lab PostgreSQL also serves Polaris
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # What the lab's commands need inside the containers: compose service names instead of localhost.
    LAB_POLARIS_URL: http://polaris:8181/api
    LAB_S3_ENDPOINT: http://seaweedfs:8333
    LAB_TRINO_URL: http://trino:8080
    LAB_TRINO_HOST: trino
    LAB_AIRFLOW_URL: http://airflow-apiserver:8080   # Part 22: the SLO check reads run states from the REST API
    DBT_PROFILES_DIR: /opt/lab/dbt/larkspur
    DBT_TARGET_PATH: /tmp/dbt/target   # the lab folder is mounted read-only
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    PYTHONDONTWRITEBYTECODE: "1"
    # Part 22: OpenLineage. Airflow's provider writes one event per line to a file (the lab replays the file into
    # OpenMetadata later: both don't fit in memory beside Trino); dbt-ol, started by the dbt tasks, writes its own.
    AIRFLOW__OPENLINEAGE__NAMESPACE: larkspur
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "file", "log_file_path": "/opt/openlineage/airflow.jsonl", "append": true}'
    LAB_DBT_OPENLINEAGE: "1"   # scripts.part17_dbt runs dbt-ol instead of dbt
    OPENLINEAGE__TRANSPORT__TYPE: file
    OPENLINEAGE__TRANSPORT__LOG_FILE_PATH: /opt/openlineage/dbt.jsonl
    OPENLINEAGE__TRANSPORT__APPEND: "true"
    # Part 22: OpenTelemetry metrics and traces to the collector (the SDK reads the standard OTEL_* variables).
    AIRFLOW__METRICS__OTEL_ON: "True"
    AIRFLOW__TRACES__OTEL_ON: "True"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_SERVICE_NAME: airflow   # traces otherwise say unknown_service
    OTEL_TRACES_EXPORTER: otlp_proto_http   # the default, `otlp`, is the gRPC exporter: it ignores the protocol above
    OTEL_METRIC_EXPORT_INTERVAL: "15000"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - .:/opt/lab:ro          # the lab's scripts, SQL, dbt project and raw files: what the tasks run
    - airflow-logs:/opt/airflow/logs
    - ./data/lab/part22/openlineage:/opt/openlineage   # Part 22: the OpenLineage event files (writable)
  depends_on: &airflow-depends
    airflow-init: { condition: service_completed_successfully }

services:
  # ---------- core: object storage, catalog, OLTP database ----------
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    profiles: [core]
    command: >
      mini -dir=/data -bucket=larkspur-raw,larkspur-lake
      -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json
      -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false -metricsPort=9327
    ports:
      - "8333:8333"   # S3 API
      - "9327:9327"   # Prometheus metrics: S3 requests by bucket and action (Part 24)
      - "8888:8888"   # filer UI (browse buckets)
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs/iam.json:/etc/seaweedfs/iam.json:ro   # STS role Polaris assumes to vend credentials (Part 9)
    environment:
      GOMEMLIMIT: 1GiB   # Go's soft heap limit: collect harder well before the container limit
    mem_limit: 1536m   # Part 3 uploads a 1.7 GB object; 1 GB left no headroom
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/"]
      interval: 5s
      retries: 30

  postgres:
    image: ${POSTGRES_IMAGE}
    profiles: [core]
    environment:
      POSTGRES_USER: larkspur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: larkspur
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD}
    # wal_level=logical from Part 16 (Debezium reads the log); a restart is enough, the data volume is kept.
    # max_slot_wal_keep_size caps the WAL a forgotten replication slot can pin (the default, -1, is unlimited).
    command: >
      postgres -c shared_buffers=256MB -c work_mem=32MB -c max_parallel_workers_per_gather=2
      -c track_io_timing=on -c wal_level=logical -c max_slot_wal_keep_size=4GB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "larkspur", "-d", "larkspur"]
      interval: 3s
      retries: 30

  polaris-bootstrap:
    image: ${POLARIS_ADMIN_IMAGE}
    profiles: [core]
    command: bootstrap --realm=POLARIS --credential=POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}
    environment: &polaris-db
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD}
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }

  polaris:
    image: ${POLARIS_IMAGE}
    profiles: [core]
    environment:
      <<: *polaris-db
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      # Polaris writes table metadata files itself and, from Part 9, calls STS to vend
      # credentials, so it has its own storage identity (seaweedfs/s3.json: lake bucket only).
      AWS_ACCESS_KEY_ID: ${POLARIS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${POLARIS_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      # Part 9 adds an STS role to the catalog Part 0 created without one; Polaris 1.8 refuses that change
      # unless this flag is on. Decide on credential vending when you create a catalog, and leave this
      # flag off outside this lab.
      'polaris.features."ALLOW_UNRESTRICTED_STORAGE_CONFIG_ROLE_CHANGES"': "true"
      # Part 18: an explicit heap (Polaris docs: JVM options go in JAVA_OPTS_APPEND). Until Part 17 the image sized
      # the heap at 80% of a 1 GB limit, and dbt's thousands of vended-credential requests took the container to
      # 0.99 GB; the limit is now 1.5 GB, leaving ~0.5 GB for metaspace, threads and the S3/STS clients.
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1g"
    ports:
      - "8181:8181"   # Iceberg REST catalog + management API
      - "8182:8182"   # health and metrics
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 5s
      retries: 30
    depends_on:
      polaris-bootstrap: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }

  polaris-setup:
    image: ${CURL_IMAGE}
    profiles: [core]
    entrypoint: ["/bin/sh", "/create-catalog.sh"]
    environment: *lab-env
    volumes:
      - ./polaris/create-catalog.sh:/create-catalog.sh:ro
    depends_on:
      polaris: { condition: service_healthy }

  # ---------- batch: distributed SQL and Spark ----------
  trino:
    image: ${TRINO_IMAGE}
    profiles: [batch]
    environment:
      <<: *lab-env
      TRINO_PG_PASSWORD: ${TRINO_PG_PASSWORD}   # Part 13's read-only PostgreSQL role
      GATEWAY_SECRET: ${GATEWAY_SECRET}         # Part 23: Trino's own Polaris principal for the governed catalog
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro   # the image's file: default metadata cache, query.min-expire-age 2m (Part 17)
      - ./trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
      - ./trino/catalog/lakehouse_analyst.properties:/etc/trino/catalog/lakehouse_analyst.properties:ro
      - ./trino/catalog/oltp.properties:/etc/trino/catalog/oltp.properties:ro   # PostgreSQL (Part 13)
      - ./trino/catalog/lakehouse_pipeline.properties:/etc/trino/catalog/lakehouse_pipeline.properties:ro   # dbt (Part 17)
      - ./trino/catalog/lakehouse_dev.properties:/etc/trino/catalog/lakehouse_dev.properties:ro   # dbt dev and CI (Part 18)
      - ./trino/catalog/governed.properties:/etc/trino/catalog/governed.properties:ro   # people, masked by OPA (Part 23)
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro   # every operation asks OPA (Part 23)
    mem_limit: 3g   # the image sizes the JVM heap at 80% of this
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      retries: 60
    depends_on:
      polaris-setup: { condition: service_completed_successfully }
      opa: { condition: service_started }

  # Part 23: Open Policy Agent decides every Trino operation, row filter and column mask (opa/policy/trino.rego).
  # It starts with Trino (profile batch) because Trino refuses every query when OPA can't be reached.
  opa:
    image: ${OPA_IMAGE}
    profiles: [batch, governance]
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --watch                          # reload the policy and data files when they change
      - --set=decision_logs.console=true # every decision, with its input, on stdout: the audit trail
      - /policy
      - /data
    volumes:
      - ./opa/policy:/policy:ro
      - ./opa/larkspur:/data/larkspur:ro   # users and the classification (exported from the tables)
    ports:
      - "8281:8181"   # 8181 on the host is Polaris
    environment:
      GOMEMLIMIT: 96MiB
    mem_limit: 128m

  spark:
    build:
      context: ./spark
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE}
        ICEBERG_VERSION: ${ICEBERG_VERSION}
        DELTA_VERSION: ${DELTA_VERSION}
    image: every-record-counts/spark:4.1.3-iceberg-${ICEBERG_VERSION}-delta-${DELTA_VERSION}-kafka
    profiles: [batch]
    environment:
      <<: *lab-env
      SPARK_CONF_DIR: /tmp/spark-conf
    ports:
      - "4040:4040"   # Spark UI while a job runs
    volumes:
      - ./spark/jobs:/opt/lakehouse/jobs:ro
      - ./sql:/opt/lakehouse/sql:ro
      - ./data/lab:/opt/lakehouse/lab:ro   # files staged on the host (Part 7 onwards)
      - spark-state:/opt/lakehouse/state   # streaming checkpoints (Part 16)
    mem_limit: 2560m
    depends_on:
      polaris-setup: { condition: service_completed_successfully }

  # ---------- olap: a real-time OLAP store (Part 13); never at the same time as Spark ----------
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    profiles: [olap]
    environment:
      CLICKHOUSE_USER: larkspur
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (the lab's scripts use it)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/lab.xml:/etc/clickhouse-server/config.d/lab.xml:ro   # server memory and caches
      - ./clickhouse/users.d/lab.xml:/etc/clickhouse-server/users.d/lab.xml:ro     # per-query limits
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 2g   # config.d caps the server at 1.5 GiB inside it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      retries: 30
    depends_on:
      polaris-setup: { condition: service_completed_successfully }

  # ---------- stream: Kafka, Kafka Connect with Debezium (Part 16) and the Iceberg sink (Part 27) ----------
  kafka:
    # One node that is both broker and KRaft controller. Two client listeners: kafka:29092 for containers,
    # localhost:9092 for the host. Setting any KAFKA_* config switches off the image's defaults, so all are here.
    image: ${KAFKA_IMAGE}
    profiles: [stream]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: replication factor 1 for internal topics. Development only.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from Connect's topic.creation.* settings
      KAFKA_LOG_DIRS: /var/lib/kafka/data        # on the kafka-data volume (the image default is under /tmp)
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m   # the start script's default is 1 GB
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    # Kafka Connect 4.3.1 (distributed mode, one worker) with the Debezium 3.7 connectors on its plugin path.
    image: ${DEBEZIUM_CONNECT_IMAGE}
    profiles: [stream]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: larkspur-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      # Any CONNECT_* variable becomes a worker property (CONNECT_A_B -> a.b). Replication factor 1: lab only.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Secrets from the environment instead of connector JSON: "${env:DEBEZIUM_DB_PASSWORD}".
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
      HEAP_OPTS: -Xms256m -Xmx768m   # the image passes this on as KAFKA_HEAP_OPTS
      # Part 27: the image's Apicurio converters (linked into the plugins under /kafka/connect), and a second plugin
      # directory for the Iceberg sink, built from source by kafka/iceberg-sink/build.sh and mounted read-only.
      ENABLE_APICURIO_CONVERTERS: "true"
      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/iceberg-plugins
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}   # the sink writes data files to SeaweedFS with the lab's static keys
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      POLARIS_CREDENTIAL: ${POLARIS_CLIENT_ID}:${POLARIS_CLIENT_SECRET}
      # How long an idle sink task waits in poll() (Connect: until the next offset commit). The Iceberg sink answers
      # its coordinator only between polls, so this, not the sink's commit interval, paces commits on a quiet topic.
      OFFSET_FLUSH_INTERVAL_MS: ${CONNECT_OFFSET_FLUSH_MS:-60000}   # the image's default
    volumes:
      - ./build/iceberg-kafka-connect-runtime-${ICEBERG_VERSION}:/kafka/iceberg-plugins/iceberg-kafka-connect-runtime:ro
    ports:
      - "8083:8083"
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ---------- stream: Apicurio Registry 3.3 (Part 27), schemas stored in the lab PostgreSQL ----------
  apicurio-db:
    # One-shot: the registry's database and role in the lab PostgreSQL, created if missing.
    image: ${POSTGRES_IMAGE}
    profiles: [stream]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APICURIO_DB_PASSWORD: ${APICURIO_DB_PASSWORD}
    entrypoint: ["/bin/bash", "/apicurio-db.sh"]
    volumes:
      - ./postgres/apicurio-db.sh:/apicurio-db.sh:ro
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }

  apicurio:
    # Core API /apis/registry/v3; Confluent-compatible API /apis/ccompat/v7 (what Flink's avro-confluent format calls).
    # The default storage is an in-memory H2 database that forgets every schema on restart; this one uses PostgreSQL.
    image: ${APICURIO_IMAGE}
    profiles: [stream]
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: ${APICURIO_DB_PASSWORD}
      APICURIO_DATASOURCE_JDBC_INITIAL_SIZE: "2"   # the defaults open 20 connections at start (max 100)
      APICURIO_DATASOURCE_JDBC_MIN_SIZE: "2"
      APICURIO_DATASOURCE_JDBC_MAX_SIZE: "10"
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"   # off by default; the lab's reset deletes its artifacts
      JAVA_OPTS_APPEND: -Xms128m -Xmx320m   # the image's run-java.sh otherwise sizes the heap at 80% of the limit
    ports:
      - "8085:8080"   # REST APIs and the UI's backend (8080 on the host is Trino)
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/apis/registry/v3/system/info > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      apicurio-db: { condition: service_completed_successfully }

  # ---------- stream: Flink 2.2 session cluster (Part 26): one JobManager, one TaskManager with 2 slots ----------
  # The official image with Flink SQL's Kafka connector (Part 26) and avro-confluent format (Part 27) added
  # (flink/Dockerfile). FLINK_PROPERTIES lines are written into /opt/flink/conf/config.yaml at start (Flink 2.x reads
  # config.yaml; flink-conf.yaml is gone). Java 17 (Flink 2.2 doesn't support Java 25). `make up-flink` starts these
  # with Kafka only. The keys:
  #   jobmanager.rpc.address / rest.address  where the TaskManager and the SQL client find the JobManager
  #   jobmanager.memory.process.size 1024m   the JobManager JVM's whole budget (448 MB heap); mem_limit 1280m above it
  #   taskmanager.memory.process.size 1536m  the TaskManager's whole budget, incl. managed memory; mem_limit 1792m
  #   taskmanager.numberOfTaskSlots 2        parallel task slots on the one TaskManager
  #   parallelism.default 1                  one source reader: a topic partition is read in its order
  flink-jobmanager:
    build:
      context: ./flink
      args:
        FLINK_IMAGE: ${FLINK_IMAGE}
    image: every-record-counts/flink:2.2.1-java17-kafka-5.0.0-avro-iceberg-1.12.0
    profiles: [stream]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
    ports:
      - "8081:8081"   # Flink web UI and REST API
    volumes:
      - ./flink/sql:/opt/flink/lab/sql:ro   # SQL scripts for bin/sql-client.sh -f
      - ./flink-jobs/build/libs:/opt/flink/lab/jobs:ro   # Part 29: job jars for bin/flink run
      - ./data/lab/flink-state:/flink-state   # Part 29: checkpoints and savepoints, shared with the TaskManager
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8081/overview | grep -q '\"taskmanagers\":[1-9]'"]
      interval: 5s
      timeout: 5s
      retries: 40

  flink-taskmanager:
    image: every-record-counts/flink:2.2.1-java17-kafka-5.0.0-avro-iceberg-1.12.0
    profiles: [stream]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./data/lab/part29:/opt/flink/lab/data/part29:ro   # Part 29: the WMS opening-stock file
      - ./data/lab/flink-state:/flink-state   # Part 29: where the TaskManager writes checkpoints (S3 in production)
    mem_limit: 1792m
    depends_on:
      flink-jobmanager: { condition: service_started }

  # ---------- orchestrate: Airflow (Part 19) ----------
  airflow-db:
    # One-shot: the metadata database and its role in the lab PostgreSQL, created if missing (also on old volumes).
    image: ${POSTGRES_IMAGE}
    profiles: [orchestrate]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    entrypoint: ["/bin/bash", "/airflow-db.sh"]
    volumes:
      - ./postgres/airflow-db.sh:/airflow-db.sh:ro
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate && airflow pools set lakehouse 1 'Lake writes through the lab Trino and PyIceberg: one at a time'"]
    mem_limit: 1g
    depends_on:
      airflow-db: { condition: service_completed_successfully }

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8090:8080"   # the UI and REST API (8080 on the host is Trino)
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    mem_limit: 2g   # the LocalExecutor's task processes (dbt, PyIceberg) live inside this container; 1.5 GB until Part 22,
                    # whose dbt-ol (it parses every model's SQL after dbt) took the peak to 1.45 GiB
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8974/health"]
      interval: 10s
      retries: 30
    depends_on:
      <<: *airflow-depends
      airflow-apiserver: { condition: service_healthy }

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 15s
      retries: 20

  # ---------- orchestrate (Part 22): an OpenTelemetry Collector that keeps what Airflow sends in a file ----------
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    profiles: [orchestrate]
    command: ["--config=/etc/otelcol/lab.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/lab.yaml:ro
      - ./data/lab/part22/otel:/otel   # metrics.jsonl, traces.jsonl (OTLP JSON, one batch per line)
    environment:
      GOMEMLIMIT: 160MiB
    mem_limit: 256m

  # ---------- lineage (Part 22): OpenMetadata 2.0 as the OpenLineage backend ----------
  # Marquez, the OpenLineage reference backend, has had no release since 0.50.0 (2024) and publishes amd64 images only;
  # OpenMetadata (Apache 2.0) accepts OpenLineage events over HTTP and ships arm64 images. It needs a search engine
  # and a database: Elasticsearch here, the lab PostgreSQL for the database. About 2.5 GB, so the lab runs it with
  # core only (Trino and Airflow stopped) and replays the event files the pipelines wrote.
  openmetadata-db:
    image: ${POSTGRES_IMAGE}
    profiles: [lineage]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
    entrypoint: ["/bin/bash", "/openmetadata-db.sh"]
    volumes:
      - ./postgres/openmetadata-db.sh:/openmetadata-db.sh:ro
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }

  openmetadata-search:
    image: ${ELASTICSEARCH_IMAGE}
    profiles: [lineage]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m   # OpenMetadata's quickstart uses 1 GB; the lab's index is tiny
      # Lab only: Elasticsearch stops placing shards when its disk is 90% full (the default high watermark), and a
      # laptop's Docker disk often is (92% here). Raised, not switched off; production keeps the defaults and adds disk.
      cluster.routing.allocation.disk.watermark.low: 95%
      cluster.routing.allocation.disk.watermark.high: 97%
      cluster.routing.allocation.disk.watermark.flood_stage: 98%
    volumes:
      - openmetadata-search:/usr/share/elasticsearch/data
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  openmetadata-migrate:
    image: ${OPENMETADATA_IMAGE}
    profiles: [lineage]
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment: &openmetadata-env
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: openmetadata
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"   # no ingestion container: lineage arrives as OpenLineage events
      OPENMETADATA_HEAP_OPTS: -Xms512m -Xmx1g
    mem_limit: 1536m
    depends_on:
      openmetadata-db: { condition: service_completed_successfully }
      openmetadata-search: { condition: service_healthy }

  openmetadata:
    image: ${OPENMETADATA_IMAGE}
    profiles: [lineage]
    environment: *openmetadata-env
    ports:
      - "8585:8585"   # UI and API
      - "8586:8586"   # admin: health and metrics
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 10s
      retries: 60
    depends_on:
      openmetadata-migrate: { condition: service_completed_successfully }

  # ---------- serve (Part 31): the semantic layer and a BI tool, over Trino + OPA (start with `make up-serve`) ----------
  cube:
    # Cube Core: the metric definitions (cube/model) served over a REST API (:4000) and a PostgreSQL-wire SQL API
    # (:15432). No Cube Store: query results are cached in Cube's memory; pre-aggregations would need it.
    image: ${CUBE_IMAGE}
    profiles: [serve]
    environment:
      CUBEJS_DB_TYPE: trino
      CUBEJS_DB_HOST: trino
      CUBEJS_DB_PORT: "8080"
      CUBEJS_DB_USER: cube                   # the default identity; cube/cube.js picks one per request scope
      CUBEJS_DB_PRESTO_CATALOG: governed     # the catalog people query: OPA filters and masks (Part 23)
      CUBEJS_DB_NAME: gold                   # the default schema
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}  # signs and verifies the REST API's tokens (HS256)
      CUBEJS_PG_SQL_PORT: "15432"            # the SQL API is off unless a port is set
      CUBEJS_SQL_USER: superset
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD}
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory  # the image sets NODE_ENV=production, whose default is Cube Store
      CUBEJS_DEV_MODE: "false"               # no playground; tokens required
      CUBEJS_TELEMETRY: "false"
      NODE_OPTIONS: --max-old-space-size=512 # the V8 heap; the SQL API's native code lives outside it
      LAB_MISTAKES: ${LAB_MISTAKES:-}   # Part 31's demos only: switch a safeguard in cube/cube.js off
    ports:
      - "4000:4000"     # REST API (/cubejs-api/v1/...)
      - "15432:15432"   # SQL API (PostgreSQL protocol)
    volumes:
      - ./cube:/cube/conf:ro   # cube.js and model/
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 30
    depends_on:
      trino: { condition: service_healthy }

  superset-db:
    # One-shot: Superset's metadata database and role in the lab PostgreSQL, created if missing.
    image: ${POSTGRES_IMAGE}
    profiles: [serve]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    entrypoint: ["/bin/bash", "/superset-db.sh"]
    volumes:
      - ./postgres/superset-db.sh:/superset-db.sh:ro
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }

  superset-init:
    # One-shot: schema migrations, the lab's admin user, default roles and permissions. Safe to re-run.
    build: &superset-build
      context: ./superset
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE}
    image: every-record-counts/superset:6.1.0-lab
    profiles: [serve]
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    command:
      - bash
      - -c
      - >
        superset db upgrade &&
        (superset fab list-users | grep -q 'username:admin' ||
        superset fab create-admin --username admin --firstname Lab --lastname Admin
        --email admin@larkspur.example --password "$$SUPERSET_ADMIN_PASSWORD") &&
        superset init
    mem_limit: 1536m
    depends_on:
      superset-db: { condition: service_completed_successfully }

  superset:
    build: *superset-build
    image: every-record-counts/superset:6.1.0-lab
    profiles: [serve]
    environment: *superset-env   # the image's server: gunicorn, 1 worker (gthread, 20 threads) by default
    ports:
      - "8088:8088"   # UI and REST API (/api/v1/...)
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 5s
      retries: 60
    depends_on:
      superset-init: { condition: service_completed_successfully }

volumes:
  seaweedfs-data:
  postgres-data:
  clickhouse-data:
  kafka-data:
  spark-state:
  airflow-logs:
  openmetadata-search:
