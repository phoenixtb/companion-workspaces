version: 2

models:
  - name: dim_date
    description: One row per calendar day of 2026 (date_key yyyymmdd); -1 is the "not yet" row.
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_store
    description: Stores (Type 1) plus one online row per country.
    columns:
      - name: store_key
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [unique]

  - name: dim_product
    description: Type 2 product versions with Type 1 current_ columns; placeholders for early-arriving facts.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sku, valid_from]

  - name: dim_promotion
    description: Promotion versions from snp_promotion, in force from version_from (inclusive) to version_to.
    columns:
      - name: promo_key
        data_tests: [unique, not_null]

  - name: dim_fx_rate
    description: The FX rate in force on every calendar day, per currency pair.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"date"', base_currency, quote_currency]

  - name: dim_sale_profile
    columns:
      - name: profile_key
        data_tests: [unique, not_null]

  - name: dim_supplier
    columns:
      - name: supplier_key
        data_tests: [unique, not_null]

  - name: fct_sales_line
    description: "Grain: one row per line of a POS basket or an online order."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [transaction_id, line_no]
          config:
            where: "event_ts >= TIMESTAMP '{{ var('test_since', '1970-01-01') }} 00:00:00 UTC'"  # Part 24
    columns:
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                where: "event_ts >= TIMESTAMP '{{ var('test_since', '1970-01-01') }} 00:00:00 UTC'"  # Part 24
      - name: promo_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_promotion')
                field: promo_key
              config:
                where: "event_ts >= TIMESTAMP '{{ var('test_since', '1970-01-01') }} 00:00:00 UTC'"  # Part 24
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                where: "event_ts >= TIMESTAMP '{{ var('test_since', '1970-01-01') }} 00:00:00 UTC'"  # Part 24

  - name: fct_basket
    description: "Grain: one row per basket or order."
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]

  - name: fct_refund
    description: "Grain: one row per refund, dated by the refund."
    columns:
      - name: refund_id
        data_tests: [unique, not_null]

  - name: fct_stock_daily
    description: "Grain: one row per store, product and business day. on_hand_qty is semi-additive."
    data_tests:
      - unique_combination_hashed:
          arguments:
            combination_of_columns: [date_key, store_key, product_key]

  - name: fct_stock_adjustment
    description: "Grain: one row per stock adjustment (at most one per store, product, day and reason)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, store_key, product_key, reason]

  - name: fct_po_line
    description: "Grain: one row per purchase-order line (accumulating snapshot)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [po_number, po_line]

  - name: rpt_daily_net_revenue
    description: >
      Net revenue per country and local business date in the reporting currency (minor units). The table behind
      Farah's revenue dashboard: its columns are a contract, and a breaking change ships as a new version.
    latest_version: 2
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key          # not supported on Trino: dbt warns and leaves it out; the grain test is the guard
        columns: [country, business_date]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country, business_date]
    columns:
      - name: country
        data_type: varchar
        constraints: [{type: not_null}]   # the one constraint dbt-trino enforces (a NOT NULL column)
      - name: business_date
        data_type: date
        constraints: [{type: not_null}]
      - name: sales_minor
        data_type: bigint
      - name: refunds_minor
        data_type: bigint
      - name: net_minor
        data_type: bigint
      - name: currency
        data_type: varchar
    versions:
      - v: 1
        deprecation_date: 2026-12-31
        config:
          alias: rpt_daily_net_revenue   # version 1 keeps the table name the dashboard reads
      - v: 2                             # `currency` renamed `report_currency`; `is_provisional` added
        columns:
          - include: all
            exclude: [currency]
          - name: report_currency
            data_type: varchar
          - name: is_provisional
            data_type: boolean
