version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: stores
      - name: fx_rates
      - name: catalog_products

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
  - name: dim_store
    columns:
      - name: store_key
        data_tests: [unique, not_null]
  - name: dim_fx_rate
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['"date"', base_currency, quote_currency]
  - name: int_product_versions
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sku, valid_from]

unit_tests:
  - name: a_changed_attribute_starts_a_new_version
    description: Four daily extracts of one SKU; its category changes on the third. Unchanged days add nothing.
    model: int_product_versions
    given:
      - input: ref('stg_catalog_products')
        rows:
          - {snapshot_date: 2026-06-01, sku: SKU-T, product_id: 1, product_name: Tea, category: Pantry, subcategory: Tea, brand: B, is_chilled: false, supplier_id: S001}
          - {snapshot_date: 2026-06-02, sku: SKU-T, product_id: 1, product_name: Tea, category: Pantry, subcategory: Tea, brand: B, is_chilled: false, supplier_id: S001}
          - {snapshot_date: 2026-06-03, sku: SKU-T, product_id: 1, product_name: Tea, category: Beverages, subcategory: Tea, brand: B, is_chilled: false, supplier_id: S001}
          - {snapshot_date: 2026-06-04, sku: SKU-T, product_id: 1, product_name: Tea, category: Beverages, subcategory: Tea, brand: B, is_chilled: false, supplier_id: S001}
    expect:
      rows:
        - {sku: SKU-T, version: 1, category: Pantry, valid_from: 2026-06-01, valid_to: 2026-06-03, is_current: false, current_category: Beverages}
        - {sku: SKU-T, version: 2, category: Beverages, valid_from: 2026-06-03, valid_to: 9999-12-31, is_current: true, current_category: Beverages}
