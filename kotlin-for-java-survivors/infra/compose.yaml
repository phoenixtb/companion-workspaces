# Local infrastructure for the Act III services. Start what a part needs, for example:
#   docker compose -f infra/compose.yaml up -d postgres
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    # One node in KRaft mode (broker and controller in one process, no ZooKeeper). The image's
    # defaults already advertise PLAINTEXT://localhost:9092 for clients on the host.
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"

volumes:
  postgres-data:
