# Local infrastructure for the Act III services. Start what a part needs, for example:
#   docker compose -f infra/compose.yaml up -d postgres
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
