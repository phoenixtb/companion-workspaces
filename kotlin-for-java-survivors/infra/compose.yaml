# Local infrastructure for the Act III services. Start what a part needs, for example:
#   docker compose -f infra/compose.yaml up -d postgres
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    # One node in KRaft mode (broker and controller in one process, no ZooKeeper). The image's
    # defaults already advertise PLAINTEXT://localhost:9092 for clients on the host.
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST API and web dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC, which the Java clients use
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    # Runs models on the CPU inside Docker. On a Mac, a natively installed Ollama uses the GPU and is
    # much faster; it listens on the same port.
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  postgres-data:
  qdrant-data:
  ollama-models:
