name: kotlin-for-java-survivors

on:
  push:
    paths:
      - "kotlin-for-java-survivors/**"
      - ".github/workflows/kotlin-for-java-survivors.yml"
  pull_request:
    paths:
      - "kotlin-for-java-survivors/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-for-java-survivors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
